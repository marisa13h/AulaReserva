name: Validar proyecto AulaReserva

on:
  push:
    branches:
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar estructura
        id: validar
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            README.md
            frontend/index.html
            frontend/app.js
            backend/public/index.php
            .github/actions/validar-aulareserva/action.yml
            .github/workflows/validar-proyecto.yml

      - name: Mostrar resultado
        run: |
          echo "Rutas verificadas: ${{ steps.validar.outputs.total }}"