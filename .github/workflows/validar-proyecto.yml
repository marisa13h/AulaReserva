name: Revisar AulaReserva

on:
  push:
    branches: [develop, "feature/**"]

  pull_request:
    branches: [develop]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revisar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Comprobar archivos frontend
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            frontend/index.html
            frontend/app.js

      - name: Comprobar sintaxis JavaScript
        run: node --check frontend/app.js

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Comprobar archivos backend
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            backend/index.php

      - name: Comprobar sintaxis PHP
        run: |
          php -l backend/index.php

  resultado:
    needs: [frontend, backend]
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar resultado final
        run: echo "Frontend y backend correctos"
