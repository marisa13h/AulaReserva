name: Validar proyecto AulaReserva

on:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Validar estructura del proyecto
        id: validar
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            README.md
            frontend/index.html
            frontend/app.js
            frontend/no-existe.html
            backend/public/index.php
            .github/actions/validar-aulareserva/action.yml

      - name: Mostrar resultado
        run: |
          echo "Rutas verificadas: ${{ steps.validar.outputs.total }}"