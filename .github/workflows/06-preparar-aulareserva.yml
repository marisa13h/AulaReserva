name: 06 - Preparar AulaReserva

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar configuración
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          mkdir -p frontend

          cat > frontend/config.js <<EOF
          window.APP_CONFIG = {
            nombre: "$APP_NAME",
            entorno: "$APP_ENV"
          };
          EOF

          cat frontend/config.js

      
      - name: Preparar entrega
        run: |
          mkdir -p dist/frontend dist/backend dist/database dist/data

          cp -r frontend/. dist/frontend/
          cp -r backend/. dist/backend/
          cp -r database/. dist/database/

          echo "Contenido del paquete:"
          find dist -maxdepth 3 -print

