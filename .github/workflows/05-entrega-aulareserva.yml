name: 05 - Entrega colaborativa AulaReserva

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  empaquetar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear carpeta dist
        run: mkdir -p dist

      - name: Copiar archivos del proyecto
        run: |
          cp -r frontend dist/
          cp -r backend dist/
          cp -r database dist/

      - name: Generar información de versión
        run: |
          echo "Proyecto: AulaReserva" > dist/version.txt
          echo "Rama: $GITHUB_REF_NAME" >> dist/version.txt
          echo "Commit: $GITHUB_SHA" >> dist/version.txt
          echo "Ejecución: $GITHUB_RUN_NUMBER" >> dist/version.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AulaReserva-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

  comprobar:
    needs: empaquetar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: AulaReserva-${{ github.run_number }}
          path: entrega/

      - name: Comprobar archivos
        run: |
          test -f entrega/frontend/index.html
          test -f entrega/backend/public/index.php
          test -f entrega/database/schema.sql
          test -f entrega/version.txt

          echo "Todos los archivos existen correctamente"

      - name: Mostrar versión
        run: cat entrega/version.txt