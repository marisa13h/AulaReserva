<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AulaReserva</title>
  </head>

  <body>
    <div class="contenedor">
      <h1>AulaReserva</h1>

      <h2>Aulas disponibles</h2>

      <section id="lista-aulas">Cargando aulas...</section>

      <h2>Solicitar una reserva</h2>

      <form id="formulario-reserva">
        <label for="aula">Selecciona un aula:</label>
        <select id="aula" required>
          <option value="">Selecciona un aula</option>
        </select>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" required />

        <label for="hora">Hora:</label>
        <input type="time" id="hora" required />

        <label for="responsable">Responsable:</label>
        <input
          type="text"
          id="responsable"
          placeholder="Nombre del responsable"
          required
        />

        <button type="submit">Solicitar reserva</button>

        <p id="mensaje"></p>
      </form>

      <section>
        <h2>Reservas registradas</h2>
        <div id="lista-reservas">Cargando reservas...</div>
      </section>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
