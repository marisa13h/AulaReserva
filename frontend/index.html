
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AulaReserva</title>

    <link rel="stylesheet" href="/assets/styles.css">

    <script src="/assets/config.js"></script>
    <script src="/assets/app.js" defer></script>
</head>

<body>

    <header class="cabecera">
        <div class="cabecera-contenido">
            <h1 id="nombre-app">AulaReserva</h1>
            <span id="entorno-app" class="etiqueta-entorno">
                Desarrollo
            </span>
        </div>
    </header>

    <main class="contenedor">

        <section class="panel">
            <h2>Aulas disponibles</h2>
            <div id="lista-aulas" class="lista-aulas">
                Cargando aulas...
            </div>
        </section>

        <section class="panel resumen">
            <h2>Resumen de reservas</h2>
            <p>
                Reservas activas:
                <strong id="contador-reservas">0</strong>
            </p>
        </section>

        <section class="panel">
            <h2>Solicitar una reserva</h2>

            <form id="formulario-reserva">

                <label for="aula">Selecciona un aula:</label>
                <select id="aula" required>
                    <option value="">Selecciona un aula</option>
                </select>

                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>

                <label for="hora">Hora:</label>
                <input type="time" id="hora" required>

                <label for="responsable">Responsable:</label>
                <input
                    type="text"
                    id="responsable"
                    placeholder="Nombre del responsable"
                    required
                >

                <button type="submit">
                    Solicitar reserva
                </button>

                <p id="mensaje" role="status" aria-live="polite"></p>

            </form>
        </section>

        <section class="panel">
            <h2>Reservas registradas</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Aula</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Responsable</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="lista-reservas">
                        <tr>
                            <td colspan="5">Cargando reservas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>AulaReserva · Gestión de reservas de aulas</p>
    </footer>

</body>
</html>
